name: Build BaiduSpeedBoost dylib

# 上传本工程到 GitHub 仓库后，此工作流在云端 macOS 上编译，无需你有 Mac。
# 触发方式：push 代码，或在 Actions 页面手动点 "Run workflow"。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos
          # 用带 rootless 补丁的 SDK 源，确保支持 iOS 15+
          theos-sdks: https://github.com/theos/sdks

      - name: Build tweaks
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS"
          # 普通(rootful)版本
          make clean
          make package FINALPACKAGE=1
          # TrollStore/TrollFools 用 rootless 版本（巨魔环境必须用这个）
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "=== 产物 ==="
          find . -name "*.dylib" -o -name "*.deb" | sort

      - name: Upload dylib + deb
        uses: actions/upload-artifact@v4
        with:
          name: BaiduSpeedBoost-build
          # .theos/obj 是编译出的裸 dylib；packages 是 deb 包
          path: |
            .theos/obj/*.dylib
            packages/*.deb
            packages/rootless/*.deb
          if-no-files-found: error
