name: Build BaiduSpeedBoost dylib

# 云端 macOS 编译，无需本地 Mac。上传工程后自动触发，也可在 Actions 页手动 Run。
# 不使用第三方 theos-action（其相对路径 THEOS 在下载 SDK 时有 mv 路径 bug），
# 改为全绝对路径手动搭建，稳定可复现。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid make wget

      - name: Setup Theos (absolute paths)
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          cd "$THEOS/sdks"
          wget --no-verbose https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -O master.tar.gz
          TMP=$(mktemp -d)
          tar -xzf master.tar.gz -C "$TMP"
          mv "$TMP"/*-master/*.sdk "$THEOS/sdks/"
          rm -rf master.tar.gz "$TMP"
          echo "SDKs installed:" && ls "$THEOS/sdks"

      - name: Build (rootful + rootless)
        run: |
          set -e
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          echo "THEOS=$THEOS"
          make clean
          make package FINALPACKAGE=1
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          echo "=== products ==="
          find "$GITHUB_WORKSPACE" \( -name "*.dylib" -o -name "*.deb" \) -not -path "*/theos/*" | sort

      - name: Upload dylib + deb
        uses: actions/upload-artifact@v4
        with:
          name: BaiduSpeedBoost-build
          path: |
            .theos/obj/*.dylib
            packages/*.deb
            packages/rootless/*.deb
          if-no-files-found: error
